# Netlify Configuration for Astro & Numerology Platform

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# 1. API proxy rewrite to Render backend (Order matters: must be before SPA fallback)
# Replace YOUR-BACKEND.onrender.com with your actual Render service URL
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# 2. SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
