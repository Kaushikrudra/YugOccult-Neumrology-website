<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Sacred Rings -->
  <circle cx="50" cy="50" r="45" stroke="#C9A227" stroke-width="2" />
  <circle cx="50" cy="50" r="41" stroke="#C9A227" stroke-width="1" stroke-dasharray="1.5 2.5" opacity="0.7" />

  <!-- Crown / Third Eye 3 Dots -->
  <circle cx="43" cy="22" r="1.6" fill="#C9A227" />
  <circle cx="50" cy="20" r="2.4" fill="#C9A227" />
  <circle cx="57" cy="22" r="1.6" fill="#C9A227" />

  <!-- Upward Crescent Moon (Cradling Star) -->
  <path
    d="M 28 50 C 28 73, 72 73, 72 50 C 63 64, 37 64, 28 50 Z"
    fill="#5B3E96"
  />

  <!-- 8-Pointed Star -->
  <polygon
    points="50,31 51.6,39.8 56.5,37.5 53.8,42.4 63,44 53.8,45.6 56.5,50.5 51.6,48.2 50,57 48.4,48.2 43.5,50.5 46.2,45.6 37,44 46.2,42.4 43.5,37.5 48.4,39.8"
    fill="#C9A227"
  />

  <!-- Center Bindu in Star -->
  <circle cx="50" cy="44" r="1.4" fill="#FBF7EE" />

  <!-- Bottom Delicate Balance Diamond -->
  <polygon points="50,79.5 51.5,81.5 50,83.5 48.5,81.5" fill="#C9A227" />
</svg>
