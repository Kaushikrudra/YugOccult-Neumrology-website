<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Poppins:wght@600;700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 39px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .brand-astro {
        fill: #2E2A5C;
      }
      .brand-veda {
        fill: #C9A227;
      }
      .brand-sub {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.46em;
        fill: #5B3E96;
        stroke: #5B3E96;
        stroke-width: 0.4px;
        paint-order: stroke fill;
      }
    </style>
  </defs>

  <!-- Circular Sacred Emblem (Left) -->
  <g transform="translate(4, 3)">
    <!-- Outer Sacred Rings -->
    <circle cx="42" cy="42" r="40" stroke="#C9A227" stroke-width="1.6" />
    <circle cx="42" cy="42" r="36.5" stroke="#C9A227" stroke-width="0.8" stroke-dasharray="1.5 2.5" opacity="0.65" />

    <!-- Crown / Third Eye 3 Dots -->
    <circle cx="35" cy="16" r="1.4" fill="#C9A227" />
    <circle cx="42" cy="14" r="2.1" fill="#C9A227" />
    <circle cx="49" cy="16" r="1.4" fill="#C9A227" />

    <!-- Upward Crescent Moon -->
    <path
      d="M 23 42 C 23 63, 61 63, 61 42 C 53 55, 31 55, 23 42 Z"
      fill="#5B3E96"
    />

    <!-- 8-Pointed Star -->
    <polygon
      points="42,24 43.4,32 47.8,30 45.4,34.4 53.8,36 45.4,37.6 47.8,42 43.4,40 42,48 40.6,40 36.2,42 38.6,37.6 30.2,36 38.6,34.4 36.2,30 40.6,32"
      fill="#C9A227"
    />

    <!-- Center Bindu -->
    <circle cx="42" cy="36" r="1.1" fill="#FBF7EE" />

    <!-- Bottom Balance Ornament -->
    <polygon points="42,69 43.3,70.8 42,72.6 40.7,70.8" fill="#C9A227" />
  </g>

  <!-- Wordmark Line 1: Yug Skill -->
  <text x="102" y="46" class="brand-title">
    <tspan class="brand-astro">Yug </tspan><tspan class="brand-veda">Skill</tspan>
  </text>

  <!-- Wordmark Line 2: INSTITUTE (Bold) -->
  <text x="103" y="68" class="brand-sub">
    INSTITUTE
  </text>
</svg>
